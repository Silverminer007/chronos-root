apiVersion: batch/v1
kind: CronJob
metadata:
  name: chronos-agent-orchestrator
  namespace: chronos-prod
spec:
  schedule: "*/5 * * * *"  # Every 5 minutes

  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: chronos-agent-orchestrator
          containers:
          - name: orchestrator
            image: chronos:orchestrator-latest
            imagePullPolicy: IfNotPresent

            env:
            - name: GITHUB_REPO_URL
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: repo-url
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: orchestrator-secrets
                  key: github-token
            - name: LOG_DIR
              value: /var/log/agent-orchestrator

            volumeMounts:
            - name: repo
              mountPath: /repo/chronos-root
            - name: logs
              mountPath: /var/log/agent-orchestrator

            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"

          volumes:
          - name: repo
            emptyDir: {}
          - name: logs
            hostPath:
              path: /var/log/chronos/orchestrator
              type: DirectoryOrCreate

          restartPolicy: OnFailure
          backoffLimit: 3

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: chronos-agent-orchestrator
  namespace: chronos-prod

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: chronos-agent-orchestrator
  namespace: chronos-prod
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log"]
  verbs: ["get", "list", "watch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: chronos-agent-orchestrator
  namespace: chronos-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: chronos-agent-orchestrator
subjects:
- kind: ServiceAccount
  name: chronos-agent-orchestrator
  namespace: chronos-prod
