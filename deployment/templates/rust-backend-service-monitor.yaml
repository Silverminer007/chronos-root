{{- if and .Values.metrics.enabled .Values.metrics.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.namespace }}-rust-backend-metrics
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.namespace }}-rust-backend
    release: prometheus  # Wichtig für kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: chronos-rust-backend
  endpoints:
  - port: metrics
    path: {{ .Values.metrics.path }}
    interval: {{ .Values.metrics.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.metrics.serviceMonitor.scrapeTimeout }}
    honorLabels: true
  namespaceSelector:
    matchNames:
    - {{ .Values.namespace }}
{{- end }}
