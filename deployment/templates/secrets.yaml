{{- $secretName := include "chronos.secretName" . -}}
{{- $provider := .Values.secrets.provider | default "bitwarden" -}}

{{- if eq $provider "bitwarden" }}
apiVersion: k8s.bitwarden.com/v1
kind: BitwardenSecret
metadata:
  labels:
    app.kubernetes.io/name: bitwardensecret
    app.kubernetes.io/instance: bitwardensecret-sample
    app.kubernetes.io/part-of: sm-operator
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/created-by: sm-operator
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
spec:
  organizationId: {{ required "secrets.organisationId is required for provider: bitwarden" .Values.secrets.organisationId }}
  secretName: {{ $secretName }}
  onlyMappedSecrets: true
  map:
    {{- include "chronos.bitwardenSecrets" . | nindent 4 }}
  authToken:
    secretName: bw-auth-token
    secretKey: token
{{- else if eq $provider "values" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- include "chronos.valuesSecrets" . | nindent 2 }}
  container_registry_secret: {{ .Values.secrets.values.container_registry_secret | default "" | quote }}
{{- if and .Values.imagePullSecret.create .Values.imagePullSecret.name (ne .Values.imagePullSecret.name "") }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.imagePullSecret.name }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: {{ printf "{\"auths\":{\"%s\":{\"username\":%q,\"password\":%q}}}" (required "imagePullSecret.registry is required when create: true" .Values.imagePullSecret.registry) (required "imagePullSecret.username is required when create: true" .Values.imagePullSecret.username) (required "imagePullSecret.password is required when create: true" .Values.imagePullSecret.password) | quote }}
{{- end }}
{{- else if eq $provider "existing" }}
# Using existing secret: {{ $secretName }}
# No secret will be created; ensure the secret exists in the cluster.
{{- else }}
{{- fail (printf "Invalid secrets.provider: %q. Must be one of: bitwarden, values, existing" $provider) }}
{{- end }}
