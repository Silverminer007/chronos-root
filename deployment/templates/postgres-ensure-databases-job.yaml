{{- if .Values.postgresql.ensureDatabases }}
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-ensure-databases
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "chronos.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: ensure-databases
          image: "postgres:{{ .Values.postgresql.image.tag }}"
          env:
            - name: PGHOST
              value: postgres
            - name: PGUSER
              value: {{ .Values.postgresql.user | quote }}
            - name: PGDATABASE
              value: {{ .Values.postgresql.database | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "chronos.secretName" . }}
                  key: {{ .Values.postgresql.passwordSecret.key }}
          command:
            - sh
            - -ec
            - |
              until pg_isready -q; do sleep 2; done
              {{- range .Values.postgresql.ensureDatabases }}
              psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ . }}'" | grep -q 1 \
                || psql -c 'CREATE DATABASE "{{ . }}"'
              {{- end }}
{{- end }}
