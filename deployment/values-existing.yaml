# Values for use with existing secrets
# Use when secrets are managed externally (e.g., Sealed Secrets, External Secrets, SOPS)

namespace: chronos

secrets:
  provider: existing
  existingSecretName: chronos-secret

# Rest of config same as values.yaml
imagePullSecret:
  name: chronos-docker-secret
  create: false

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
  host: cluster.chronos-live.de
  tls:
    secretName: chronos-tls-cert

frontend:
  replicaCount: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  image:
    repository: ghcr.io/silverminer007/chronos-frontend
    tag: latest
    pullPolicy: Always
  containerPort: 3000
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    NUXT_AUTH_ISSUER: "https://auth.chronos-live.de/realms/chronos"
    NUXT_AUTH_REDIRECT_URI: https://cluster.chronos-live.de/api/auth/callback
    NUXT_QUARKUS_URL: "http://chronos-backend"
    NUXT_PUBLIC_IMPRESSUM_NAME: "Justus Henze"
    NUXT_PUBLIC_IMPRESSUM_STREET: "Malmedystraße 3"
    NUXT_PUBLIC_IMPRESSUM_CITY: "46145 Oberhausen"
    NUXT_PUBLIC_IMPRESSUM_EMAIL: "henze5@gmx.de"
  envFromSecrets:
    - name: NUXT_AUTH_CLIENT_ID
      secretKey: frontend_client_id
    - name: SENTRY_AUTH_TOKEN
      secretKey: frontend_sentry_auth_token
    - name: NUXT_PUBLIC_SENTRY_DSN
      secretKey: frontend_sentry_dsn

backend:
  replicaCount: 2
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  image:
    repository: ghcr.io/silverminer007/chronos-backend
    tag: latest
    pullPolicy: Always
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "256Mi"
      cpu: "250m"
    limits:
      memory: "512Mi"
      cpu: "500m"
  env:
    DB_URL: "jdbc:postgresql://postgres:5432/chronos"
    DB_USER: "postgres"
    AUTH_SERVER_URL: "https://auth.chronos-live.de/realms/chronos"
  envFromSecrets:
    - name: DB_PASSWORD
      secretKey: database_password
    - name: AUTH_SERVER_CLIENT_ID
      secretKey: backend_client_id
    - name: AUTH_SERVER_CLIENT_SECRET
      secretKey: backend_client_secret
    - name: VAPID_PUBLIC
      secretKey: vapid_public_key
    - name: VAPID_PRIVATE
      secretKey: vapid_private_key
    - name: VAPID_MAILTO
      secretKey: vapid_mailto
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 9000
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 9000
    initialDelaySeconds: 5
    periodSeconds: 5

rustBackend:
  enabled: false
  replicaCount: 1
  autoscaling:
    enabled: false
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  image:
    repository: ghcr.io/silverminer007/chronos-rust-backend
    tag: latest
    pullPolicy: Always
  containerPort: 8080
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "250m"
  env:
    RUST_LOG: "chronos_date_api=info,tower_http=info"
    ENVIRONMENT: "staging"
  envFromSecrets: []
  livenessProbe:
    httpGet:
      path: /q/health/live
      port: 8080
    initialDelaySeconds: 30
    periodSeconds: 10
  readinessProbe:
    httpGet:
      path: /q/health/ready
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 5

postgresql:
  enabled: true
  image:
    tag: "16"
  database: chronos
  storage:
    size: 10Gi
    storageClass: hcloud-volumes
  passwordSecret:
    name: chronos-secret
    key: database_password
  backup:
    s3_path: "chronos-backup"
    host: "postgres"
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

metrics:
  enabled: true
  port: 9000
  targetPort: 9000
  path: /metrics
  serviceMonitor:
    enabled: true
    interval: 30s
    scrapeTimeout: 10s

alerts:
  enabled: true
  rules:
    podDown:
      for: 2m
    postgresDown:
      for: 1m
    highCPU:
      threshold: 0.8
      for: 5m
    highMemory:
      threshold: 0.9
      for: 5m
    postgresDiskFull:
      threshold: 0.85
      for: 2m
    podRestarting:
      threshold: 3
    sslExpiry:
      daysWarning: 7
