global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'local-development'

scrape_configs:
  - job_name: 'chronos-backend'
    static_configs:
      - targets: ['localhost:8080']  # Quarkus backend on port 8080
    metrics_path: '/q/metrics'
    scrape_interval: 5s  # More frequent scraping for performance testing

  - job_name: 'chronos-backend-k8s'
