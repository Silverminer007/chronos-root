<div class="appointment-card" aria-hidden="true">
  <div class="appointment-card-body placeholder-glow">
    <div class="d-flex align-items-start justify-content-between gap-3">
      <span class="placeholder rounded-2 title"></span>
      <div class="d-flex avatar-stack">
        @for (i of avatars; track i) {
          <span class="placeholder rounded-circle placeholder-avatar"></span>
        }
      </div>
    </div>
    <span class="placeholder rounded-2 line"></span>
    <span class="placeholder rounded-3 block"></span>
    <div class="d-flex gap-2">
      @for (i of actions; track i) {
        <span class="placeholder rounded-2 action"></span>
      }
    </div>
  </div>
</div>
