@if (loading()) {
  <div class="min-vh-100 d-flex align-items-center justify-content-center text-center">
    <div>
      <span class="spinner-border text-primary mb-3" aria-hidden="true"></span>
      <p class="text-body-secondary mb-0" role="status">Termin wird geladen...</p>
    </div>
  </div>
} @else if (error()) {
  <div class="min-vh-100 d-flex align-items-center justify-content-center text-center px-3">
    <div class="error-box">
      <i class="bi bi-exclamation-circle fs-1 text-danger d-block mb-3" aria-hidden="true"></i>
      <h2 class="fw-bold mb-2">Termin nicht gefunden</h2>
      <p class="text-body-secondary mb-4">{{ error() }}</p>
      <button type="button" class="btn btn-gradient btn-lg" (click)="backNavigation.back()">Zurück zur Übersicht</button>
    </div>
  </div>
} @else if (store.currentAppointment(); as appointment) {
  <app-appointment-header [appointment]="appointment" />

  <main class="container py-4">
    <div class="detail-grid">
      <app-appointment-details-card class="area-details" [appointment]="appointment" />
      <app-own-participation-status-card class="area-own" [appointment]="appointment" />
      <div class="area-side d-flex flex-column gap-4">
        <app-participants-status-card [appointment]="appointment" />
        <app-group-participants-card [appointment]="appointment" />
        <app-appointment-responsible-actions [appointment]="appointment" />
      </div>
      <app-messages-card class="area-messages" [appointment]="appointment" />
    </div>
  </main>
}
