<div class="blob blob-top" aria-hidden="true"></div>
<div class="blob blob-bottom" aria-hidden="true"></div>

<main class="content d-flex flex-column align-items-center justify-content-center px-3 py-5">
  <div class="d-flex align-items-center gap-2 mb-4">
    <img src="/icons/icon.png" alt="Chronos Logo" class="logo rounded shadow" />
    <span class="fs-4 fw-bold text-white">Chronos</span>
  </div>

  <div class="d-flex gap-2 mb-4" role="group" aria-label="Schritte">
    @for (s of steps; track $index) {
      <button
        type="button"
        class="dot"
        [class.active]="$index === currentStep()"
        [attr.aria-label]="'Schritt ' + ($index + 1)"
        [attr.aria-current]="$index === currentStep() ? 'step' : null"
        (click)="currentStep.set($index)"
      ></button>
    }
  </div>

  <div class="glass-card step-card shadow-lg text-center p-4 p-sm-5">
    <span class="icon-tile step-icon mx-auto mb-4" aria-hidden="true"><i class="bi fs-2" [class]="step().icon"></i></span>
    <h1 class="h2 fw-bold mb-3">{{ step().title }}</h1>
    <p class="fs-5 text-body-secondary mb-0">{{ step().description }}</p>
  </div>

  <div class="d-flex align-items-center gap-3 mt-4">
    @if (currentStep() > 0) {
      <button type="button" class="btn btn-outline-light" (click)="previous()">Zurück</button>
    }
    @if (isLast()) {
      <button type="button" class="btn btn-gradient fw-semibold px-4 shadow" (click)="complete()">Loslegen</button>
    } @else {
      <button type="button" class="btn btn-gradient fw-semibold px-4 shadow" (click)="next()">Weiter</button>
    }
  </div>

  @if (!isLast()) {
    <button type="button" class="btn btn-link btn-sm text-white-50 text-decoration-none mt-3" (click)="complete()">Überspringen</button>
  }
</main>
