[package]
name = "chronos_date_api"
version = "0.1.0"
edition = "2021"

# Build with minimal dependencies for now
# The full web stack dependencies will be added incrementally

[[bin]]
name = "chronos_date_api"
path = "src/main.rs"

[dependencies]
# Web framework and async runtime
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# Time support
chrono = { version = "0.4", features = ["serde"] }

# JWT and security
jsonwebtoken = "9"
async-trait = "0.1"
reqwest = { version = "0.11", features = ["json"] }
http = "1"

# Database
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio-rustls", "uuid", "chrono"] }

# Event bus and async utilities
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
testcontainers = "0.16"
testcontainers-modules = { version = "0.4", features = ["postgres"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["trace"] }
hyper = "1"
