name: Rust Backend CI

on:
  push:
    branches: [ main ]
    paths: [ 'rust-backend/**', '.github/workflows/backend-rust-test.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'rust-backend/**', '.github/workflows/backend-rust-test.yml' ]

permissions:
  contents: write
  checks: write
  packages: write

defaults:
  run:
    working-directory: rust-backend

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check code formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Run clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Run unit tests
        run: cargo test --lib --locked
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  test-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Run integration tests
        run: cargo test --test '*' --locked -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Check that no test databases are left behind
        run: |
          left=$(psql "$TEST_DATABASE_URL" -Atc "SELECT count(*) FROM pg_database WHERE datname ~ '^test_db_[0-9]+_'")
          echo "Test databases left on the server: $left"
          test "$left" -eq 0
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

  coverage:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage (unit + integration tests)
        run: cargo llvm-cov --all-targets --all-features --workspace --locked --output-path lcov.info -- --include-ignored
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Report coverage summary
        run: |
          cargo llvm-cov report --output-path coverage-report.txt
          cat coverage-report.txt >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: rust-backend/lcov.info
      - name: Enforce coverage threshold
        run: |
          # Read line coverage from the JSON totals. `--output-path` would send the report to a file,
          # so the JSON must go to stdout. A parse failure aborts instead of reading as 0%.
          COVERAGE=$(cargo llvm-cov report --json --summary-only | python3 -c "import json,sys; print(json.load(sys.stdin)['data'][0]['totals']['lines']['percent'])")
          if [ -z "$COVERAGE" ]; then echo "::error::Could not read line coverage from llvm-cov report" >&2; exit 1; fi
          # Ratchet: threshold is the coverage rounded down to the nearest 5, min 40%
          THRESHOLD=$(awk "BEGIN {t = int($COVERAGE / 5) * 5; print (t < 40 ? 40 : t)}")
          echo "Coverage: $COVERAGE%, Threshold: $THRESHOLD%" | tee -a $GITHUB_STEP_SUMMARY
          awk "BEGIN {exit !($COVERAGE >= $THRESHOLD)}" || exit 1

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check advisories, licenses, bans, sources
        run: cargo deny check advisories bans licenses sources

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Generate and check documentation
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  docker-build:
    needs: [fmt, clippy, test-unit, test-integration, coverage, deny, docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: rust-backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  calculate-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      version: ${{steps.version.outputs.VERSION}}
      image: ${{steps.version.outputs.IMAGE}}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Semantic Release
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github
        working-directory: ${{ github.workspace }}
      - name: Run Semantic Release
        if: github.ref == 'refs/heads/main'
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --plugins \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github
        working-directory: ${{ github.workspace }}
      - name: Calculate Image Name and Version tag
        id: version
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION=$(git tag --sort=-creatordate | head -1)
            if [ -z "$VERSION" ]; then
              echo "Error: No tags found on main branch" >&2
              exit 1
            fi
          else
            VERSION="develop-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          IMAGE=ghcr.io/$REPO_OWNER_LC/chronos-rust-backend
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "**Image**: $IMAGE:$VERSION" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs:
      - calculate-version
      - fmt
      - clippy
      - test-unit
      - test-integration
      - coverage
      - deny
      - docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install musl toolchain for vendored OpenSSL
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools perl make
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} .
          docker push ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}}
      - name: Re-tag Docker Image (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} ${{needs.calculate-version.outputs.image}}:latest
          docker push ${{needs.calculate-version.outputs.image}}:latest
