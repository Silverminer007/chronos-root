name: Rust Backend CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'rust-backend/**', '.github/workflows/backend-rust-test.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'rust-backend/**' ]

permissions:
  contents: write
  checks: write
  packages: write

defaults:
  run:
    working-directory: rust-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: rust-backend
      - name: Run unit tests
        run: cargo test --lib
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Run integration tests
        run: cargo test --test '*'
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: rust-backend
      - name: Check code formatting
        run: cargo fmt --check
      - name: Run clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: rust-backend
      - name: Run type checking
        run: cargo check --all-targets --all-features

  calculate-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      version: ${{steps.version.outputs.VERSION}}
      image: ${{steps.version.outputs.IMAGE}}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Semantic Release
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github
        working-directory: ${{ github.workspace }}
      - name: Run Semantic Release
        if: github.ref == 'refs/heads/main'
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --plugins \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github
        working-directory: ${{ github.workspace }}
      - name: Calculate Image Name and Version tag
        id: version
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION=$(git tag --sort=-creatordate | head -1)
            if [ -z "$VERSION" ]; then
              echo "Error: No tags found on main branch" >&2
              exit 1
            fi
          else
            VERSION="develop-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          IMAGE=ghcr.io/$REPO_OWNER_LC/chronos-rust-backend
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "**Image**: $IMAGE:$VERSION" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs:
      - calculate-version
      - test
      - lint
      - type-check
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          working-directory: rust-backend
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl --features web
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} .
          docker push ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}}
      - name: Re-tag Docker Image (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} ${{needs.calculate-version.outputs.image}}:latest
          docker push ${{needs.calculate-version.outputs.image}}:latest
      - name: Re-tag Docker Image (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          docker tag ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} ${{needs.calculate-version.outputs.image}}:develop
          docker push ${{needs.calculate-version.outputs.image}}:develop

  deploy:
    needs:
      - build
      - calculate-version
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Trigger Production Deployment
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-production","client_payload":{"service":"rust-backend","version":"${{needs.calculate-version.outputs.version}}","image":"${{needs.calculate-version.outputs.image}}"}}'
      - name: Trigger Staging Deployment
        if: github.ref == 'refs/heads/develop'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-staging","client_payload":{"service":"rust-backend","version":"${{needs.calculate-version.outputs.version}}","image":"${{needs.calculate-version.outputs.image}}"}}'
