name: Rust Backend CI

on:
  push:
    branches: [ main, develop ]
    paths: [ 'rust-backend/**', '.github/workflows/backend-rust-test.yml' ]
  pull_request:
    branches: [ main, develop ]
    paths: [ 'rust-backend/**', '.github/workflows/backend-rust-test.yml' ]

permissions:
  contents: write
  checks: write
  packages: write

defaults:
  run:
    working-directory: rust-backend

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check code formatting
        run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Run clippy linter
        run: cargo clippy --all-targets --all-features -- -D warnings

  test-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Run unit tests
        run: cargo test --lib --locked
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  test-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Run integration tests
        run: cargo test --test '*' --locked -- --include-ignored
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov
      - name: Generate coverage (unit + integration tests)
        run: cargo llvm-cov --all-targets --all-features --workspace --locked --output-path lcov.info -- --include-ignored
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"
      - name: Report coverage summary
        run: |
          cargo llvm-cov report --output-path coverage-report.txt
          cat coverage-report.txt >> $GITHUB_STEP_SUMMARY
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: rust-backend/lcov.info
      - name: Enforce coverage threshold
        run: |
          # Extract line coverage and enforce ratchet (rounded down to nearest 5, min 40%)
          set +e
          COVERAGE=$(cargo llvm-cov report --output-path /dev/null 2>&1 | grep -oP 'Lines\s+\K[0-9.]+(?=%)' | head -1)
          set -e
          if [ -z "$COVERAGE" ]; then COVERAGE=0; fi
          THRESHOLD=$(awk "BEGIN {t = int($COVERAGE / 5) * 5; print (t < 40 ? 40 : t)}")
          echo "Coverage: $COVERAGE%, Threshold: $THRESHOLD%" | tee -a $GITHUB_STEP_SUMMARY
          (( $(echo "$COVERAGE >= $THRESHOLD" | bc -l) )) || exit 1

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny
        run: cargo install cargo-deny
      - name: Check advisories, licenses, bans, sources
        run: cargo deny check advisories bans licenses sources

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Generate and check documentation
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"

  docker-build:
    needs: [fmt, clippy, test-unit, test-integration, coverage, deny, docs]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: rust-backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  calculate-version:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    outputs:
      version: ${{steps.version.outputs.VERSION}}
      image: ${{steps.version.outputs.IMAGE}}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Node.js
        if: github.ref == 'refs/heads/main'
        uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Install Semantic Release
        if: github.ref == 'refs/heads/main'
        run: |
          npm install -g semantic-release \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github
        working-directory: ${{ github.workspace }}
      - name: Run Semantic Release
        if: github.ref == 'refs/heads/main'
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npx semantic-release --plugins \
            @semantic-release/commit-analyzer \
            @semantic-release/release-notes-generator \
            @semantic-release/github
        working-directory: ${{ github.workspace }}
      - name: Calculate Image Name and Version tag
        id: version
        run: |
          REPO_OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            VERSION=$(git tag --sort=-creatordate | head -1)
            if [ -z "$VERSION" ]; then
              echo "Error: No tags found on main branch" >&2
              exit 1
            fi
          else
            VERSION="develop-$(echo ${{ github.sha }} | cut -c1-8)"
          fi
          IMAGE=ghcr.io/$REPO_OWNER_LC/chronos-rust-backend
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "**Image**: $IMAGE:$VERSION" >> $GITHUB_STEP_SUMMARY
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs:
      - calculate-version
      - fmt
      - clippy
      - test-unit
      - test-integration
      - coverage
      - deny
      - docs
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Set up Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend
      - name: Build release binary
        run: cargo build --release --target x86_64-unknown-linux-musl --locked
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push Docker Image
        run: |
          docker build -t ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} .
          docker push ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}}
      - name: Re-tag Docker Image (latest)
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} ${{needs.calculate-version.outputs.image}}:latest
          docker push ${{needs.calculate-version.outputs.image}}:latest
      - name: Re-tag Docker Image (develop)
        if: github.ref == 'refs/heads/develop'
        run: |
          docker tag ${{needs.calculate-version.outputs.image}}:${{needs.calculate-version.outputs.version}} ${{needs.calculate-version.outputs.image}}:develop
          docker push ${{needs.calculate-version.outputs.image}}:develop

  deploy:
    needs:
      - build
      - calculate-version
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Trigger Production Deployment
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-production","client_payload":{"service":"rust-backend","version":"${{needs.calculate-version.outputs.version}}","image":"${{needs.calculate-version.outputs.image}}"}}'
      - name: Trigger Staging Deployment
        if: github.ref == 'refs/heads/develop'
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.repository }}/dispatches \
            -d '{"event_type":"deploy-staging","client_payload":{"service":"rust-backend","version":"${{needs.calculate-version.outputs.version}}","image":"${{needs.calculate-version.outputs.image}}"}}'
