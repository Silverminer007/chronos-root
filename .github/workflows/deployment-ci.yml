name: 🚀 Deploy to Kubernetes

# staging-deploy.yml (push to develop) calls this workflow with the SHA tag of the images it built, so
# staging is deployed from the workflow and chart of develop. A repository_dispatch event always runs
# the workflow file and the chart of the DEFAULT branch (main) and is only used for production.
on:
  push:
    branches: [ main ]
    paths: [ 'deployment/**', '.github/workflows/deployment-ci.yml' ]
  repository_dispatch:
    types: [ deploy-staging, deploy-production ]
  workflow_call:
    inputs:
      tag:
        description: Image tag (short commit SHA) of frontend, backend and rust-backend for staging
        type: string
        required: true

defaults:
  run:
    working-directory: deployment

concurrency:
  group: deploy-${{ github.ref }}-${{ github.event.action || 'push' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: 🚀 Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔧 Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: 📦 Set up Helm
        uses: azure/setup-helm@v3
        with:
          version: 'latest'

      - name: 🔐 Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CA_CERT }}" | base64 -d > ca.crt
          kubectl config set-cluster k3s-cluster \
            --server=${{ secrets.KUBE_SERVER }} \
            --certificate-authority=ca.crt
          kubectl config set-credentials github-actions \
            --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context k3s-context \
            --cluster=k3s-cluster \
            --user=github-actions
          kubectl config use-context k3s-context

      - name: ✅ Test kubectl connection
        run: |
          echo "🔍 Testing Kubernetes connection..."
          kubectl get pods -n chronos-prod

      - name: 🎯 Determine deployment target
        id: deployment-info
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "namespace=chronos-staging" >> $GITHUB_OUTPUT
            echo "values_file=values-staging.yaml" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "${{ github.event.action }}" = "deploy-production" ]; then
              echo "environment=production" >> $GITHUB_OUTPUT
              echo "namespace=chronos-prod" >> $GITHUB_OUTPUT
              echo "values_file=values-prod.yaml" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.action }}" = "deploy-staging" ]; then
              echo "environment=staging" >> $GITHUB_OUTPUT
              echo "namespace=chronos-staging" >> $GITHUB_OUTPUT
              echo "values_file=values-staging.yaml" >> $GITHUB_OUTPUT
            fi
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "namespace=chronos-prod" >> $GITHUB_OUTPUT
            echo "values_file=values-prod.yaml" >> $GITHUB_OUTPUT
          fi

      - name: 📋 Show deployment info
        run: |
          echo "## 🚀 Deployment Info" >> $GITHUB_STEP_SUMMARY
          echo "**Environment**: ${{ steps.deployment-info.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace**: ${{ steps.deployment-info.outputs.namespace }}" >> $GITHUB_STEP_SUMMARY
          echo "**Values file**: ${{ steps.deployment-info.outputs.values_file }}" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by**: ${{ github.event.client_payload.service || 'Config Change' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image Tag**: ${{ github.event.client_payload.image || 'Config Change' }}:${{ github.event.client_payload.version }}" >> $GITHUB_STEP_SUMMARY

      - name: Override version
        run: |
          touch overrides.yaml
          VERSION=${{ github.event.client_payload.version }}
          REPOSITORY=${{ github.event.client_payload.image }}
          echo "$REPOSITORY:$VERSION"
          if [ -n "${{ inputs.tag }}" ]; then
            # repositories stay from the values file; every image is built from this commit
            printf 'frontend:\n  image:\n    tag: "%s"\nbackend:\n  image:\n    tag: "%s"\nrustBackend:\n  image:\n    tag: "%s"\n' \
              "${{ inputs.tag }}" "${{ inputs.tag }}" "${{ inputs.tag }}" >> overrides.yaml
          elif [ "${{ github.event.client_payload.service }}" = "backend" ]; then
            echo "
            backend:
              image:
                tag: $VERSION
                repository: $REPOSITORY" >> overrides.yaml
          elif [ "${{ github.event.client_payload.service }}" = "frontend" ]; then
            echo "
            frontend:
              image:
                tag: $VERSION
                repository: $REPOSITORY" >> overrides.yaml
          elif [ "${{ github.event.client_payload.service }}" = "rust-backend" ]; then
            echo "
            rustBackend:
              image:
                tag: $VERSION
                repository: $REPOSITORY" >> overrides.yaml
          fi

      - name: 🔍 Debug before deployment
        run: |
          NAMESPACE=${{ steps.deployment-info.outputs.namespace }}
          VALUES_FILE=${{ steps.deployment-info.outputs.values_file }}

          echo "## 🔍 Pre-deployment Checks"

          echo "📋 Checking values file..."
          if [ ! -f "$VALUES_FILE" ]; then
            echo "❌ Values file not found: $VALUES_FILE"
            ls -la *.yaml
            exit 1
          fi
          cat $VALUES_FILE

          echo "📋 Testing Helm template..."
          helm template chronos . -f $VALUES_FILE -f ./overrides.yaml --namespace $NAMESPACE --debug

          echo "📋 Checking existing resources..."
          kubectl get all -n $NAMESPACE || echo "Namespace empty or doesn't exist"

      - name: 🚀 Deploy to Kubernetes
        run: |
          ENVIRONMENT=${{ steps.deployment-info.outputs.environment }}
          NAMESPACE=${{ steps.deployment-info.outputs.namespace }}
          VALUES_FILE=${{ steps.deployment-info.outputs.values_file }}

          echo "🚀 Deploying Chronos to $ENVIRONMENT..."

          helm upgrade chronos . \
            --namespace $NAMESPACE \
            -f ./$VALUES_FILE \
            -f ./overrides.yaml \
            --install \
            --debug

          echo "✅ $ENVIRONMENT deployment completed!"

      - name: ✅ Verify rollout
        run: |
          NAMESPACE=${{ steps.deployment-info.outputs.namespace }}
          # helm upgrade does not wait: fail the run if a Deployment does not become ready
          for d in $(kubectl get deployments -n $NAMESPACE -o name); do
            kubectl rollout status $d -n $NAMESPACE --timeout=420s
          done
          kubectl get pods -n $NAMESPACE -o wide

      - name: 🔍 Debug on failure
        if: failure()
        run: |
          NAMESPACE=${{ steps.deployment-info.outputs.namespace }}

          echo "## 🚨 Deployment Failed - Debug Info"

          echo "📋 Helm Status:"
          helm status chronos -n $NAMESPACE || echo "No helm release found"

          echo "📋 Pod Status:"
          kubectl get pods -n $NAMESPACE -o wide

          echo "📋 Recent Events:"
          kubectl get events -n $NAMESPACE --sort-by=.metadata.creationTimestamp --field-selector type=Warning

          echo "📋 Logs of pods that are not Running/Completed:"
          for p in $(kubectl get pods -n $NAMESPACE --no-headers | grep -vE "Running|Completed" | awk '{print $1}'); do
            echo "--- $p"; kubectl logs $p -n $NAMESPACE --all-containers --tail=80 || true
            kubectl logs $p -n $NAMESPACE --all-containers --previous --tail=80 || true
          done
          for p in $(kubectl get pods -n $NAMESPACE --no-headers | grep -E "rust" | awk '{print $1}'); do
            echo "--- $p (rust)"; kubectl logs $p -n $NAMESPACE --tail=120 || true
          done

          echo "📋 Pod Details:"
          kubectl get pods -n $NAMESPACE | grep -v Running | tail -n +2 | awk '{print $1}' | xargs -I {} kubectl describe pod {} -n $NAMESPACE

          echo "📋 Secrets:"
          kubectl get secrets -n $NAMESPACE